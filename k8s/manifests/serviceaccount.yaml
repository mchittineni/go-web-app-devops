# A dedicated identity with no RBAC bindings. The app never talks to the API
# server, so its token is not mounted into the pod at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-web-app
  labels:
    app.kubernetes.io/name: go-web-app
    app.kubernetes.io/instance: go-web-app
automountServiceAccountToken: false
